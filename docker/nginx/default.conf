# ==============================================================================
# Backtrace Production Nginx Server Block (TLS Termination + Reverse Proxy)
# ==============================================================================

upstream backtrace_backend {
    server backtrace-app:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server - ACME Challenge & Permanent Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.backtrace.dev backtrace.dev _;

    # Let's Encrypt ACME Challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Production SSL & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.backtrace.dev backtrace.dev;

    # Let's Encrypt Certificates (Certbot)
    ssl_certificate /etc/letsencrypt/live/backtrace.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backtrace.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/backtrace.dev/chain.pem;

    # Modern SSL Security Configuration (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Static Assets / Root
    location / {
        proxy_pass http://backtrace_backend;
        proxy_http_version 1.1;

        # Connection & Upgrade Headers (WebSockets / SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Pass through rate-limiting headers
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header X-RateLimit-Reset;
        proxy_pass_header Retry-After;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Dedicated Health Check (Bypasses proxy buffering for instant probes)
    location /health {
        proxy_pass http://backtrace_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        access_log off;
    }
}
